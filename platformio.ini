board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
monitor_speed = 115200
build_flags =
  -DTARGET_SEEED_XIAO_NRF52840_SENSE_PLUS
lib_deps =
  adafruit/Adafruit NeoPixel@^1.12.0
  https://github.com/Seeed-Studio/Seeed_Arduino_LSM6DS3.git
