[platformio]
default_envs = seeed_xiao_nrf52840

[env:seeed_xiao_nrf52840]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
monitor_speed = 115200
build_flags =
  -DTARGET_SEEED_XIAO_NRF52840_SENSE_PLUS
lib_deps =
  adafruit/Adafruit NeoPixel@^1.12.0
  https://github.com/Seeed-Studio/Seeed_Arduino_LSM6DS3.git

[env:fluid_sim_self_test]
extends = env:seeed_xiao_nrf52840
build_flags =
  ${env:seeed_xiao_nrf52840.build_flags}
  -DFLUID_SIM_SELF_TEST
